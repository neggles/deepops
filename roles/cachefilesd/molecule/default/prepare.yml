---
- hosts: all
  become: true
  tasks:
    - name: ensure apt cache is updated
      ansible.builtin.apt:
        update_cache: true
      when: ansible_distribution == "Ubuntu"

    - name: workaround to enable service in container
      shell: printf '$!/bin/sh\nexit 0' > /usr/sbin/policy-rc.d
      when: ansible_distribution == "Ubuntu"
