---
- name: RedHat | trust GPG key for EPEL
  ansible.builtin.rpm_key:
    key: "{{ epel_key_url }}"
    state: present

- name: RedHat | add epel repo
  become: true
  ansible.builtin.yum:
    name:
      - "{{ epel_package }}"
    state: present
  environment: "{{ proxy_env if proxy_env is defined else {} }}"

- name: RedHat | add CUDA repo
  ansible.builtin.yum_repository:
    name: cuda
    description: NVIDIA CUDA YUM Repo
    baseurl: "{{ nvidia_driver_rhel_cuda_repo_baseurl }}"
    gpgkey: "{{ nvidia_driver_rhel_cuda_repo_gpgkey }}"
  environment: "{{ proxy_env if proxy_env is defined else {} }}"

- name: RedHat | install cuda
  ansible.builtin.package:
    name: "{{ cuda_version }}"
    state: present

- name: RedHat | Extra CUDA versions
  when: (cuda_version_extra | length) > 0
  block:
    - name: RedHat | Install extra CUDA versions
      ansible.builtin.package:
        name: "{{ cuda_version_extra }}"
        state: present

    - name: RedHat | Set default CUDA version
      community.general.alternatives:
        name: cuda
        link: /usr/local/cuda
        path: "/usr/local/cuda-{{ cuda_version_major }}.{{ cuda_version_minor }}"
        state: selected
        priority: "{{ (cuda_version_major ~ cuda_version_minor) | int }}"

- name: RedHat | Set default CUDA version
  community.general.alternatives:
    name: cuda
    link: /usr/local/cuda
    path: "/usr/local/cuda-{{ cuda_version_major }}.{{ cuda_version_minor }}"
    priority: "{{ (cuda_version_major ~ cuda_version_minor) | int }}"
    state: auto
  when: (cuda_version_extra | length) == 0
