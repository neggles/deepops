---
- name: Install NVIDIA driver
  hosts: "{{ hostlist | default('all') }}"
  become: true
  environment: "{{proxy_env if proxy_env is defined else{}}}"
  tags:
    - nvidia
    - nvidia_driver
  tasks:
    - name: Check for DGX packages
      ansible.builtin.stat:
        path: /etc/dgx-release
      register: is_dgx

    - name: Gather custom facts
      ansible.builtin.include_role:
        name: facts

    - name: Install NVIDIA driver
      ansible.builtin.include_role:
        name: nvidia.nvidia_driver
      when:
        - nvidia_driver_install is True
        - nvidia_driver_force_install is True or is_dgx.stat.exists is False

    - name: Test NVIDIA driver
      ansible.builtin.command: nvidia-smi
      changed_when: false
      when:
        - ansible_local['gpus']['count'] | bool | default(false)
        - is_dgx.stat.exists is False
