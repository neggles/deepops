#
# Server Inventory File
#
# Uncomment and change the IP addresses in this file to match your environment
# Define per-group or per-host configuration in group_vars/*.yml

all:
  ######
  # SSH connection configuration
  ######
  vars:
    ansible_user: clusteradmin
    ansible_ssh_private_key_file: "{{ inventory_dir }}/secrets/id_clusteradmin"
    # ansible_ssh_common_args: '-o ProxyCommand="ssh -W %h:%p -q ubuntu@10.0.0.1"'

  ######
  # ALL NODES
  # NOTE: Use existing hostnames here, DeepOps will configure server hostnames to match these values
  ######
  hosts:
    mgmt01:
      ansible_host: 10.0.0.1
    mgmt02:
      ansible_host: 10.0.0.2
    mgmt03:
      ansible_host: 10.0.0.3
    login01:
      ansible_host: 10.0.1.1
    gpu01:
      ansible_host: 10.0.2.1
    gpu02:
      ansible_host: 10.0.2.2

######
# KUBERNETES
######
kube-master:
  hosts:
    mgmt01: {}
    mgmt02: {}
    mgmt03: {}

# Odd number of nodes required.
etcd:
  # Comment the below hosts entries and uncomment this if you have an odd number of k8s controllers
  # children:
  #   kube-master: {}
  hosts:
    mgmt01: {}
    mgmt02: {}
    mgmt03: {}

# Add management/login/control plane nodes here if they will also be used for compute tasks
kube-node:
  hosts:
    gpu01: {}
    gpu02: {}

k8s-cluster:
  children:
    kube-master: {}
    kube-node: {}

######
# SLURM
######
slurm-controller:
  # maximum of 2 hosts here
  hosts:
    login01: {}

slurm-nfs:
  hosts:
    login01: {}

slurm-node:
  hosts:
    gpu01: {}
    gpu02: {}

# The following groups are used to break out individual cluster services onto
# different nodes. By default, we put all these functions on the cluster head
# node. To break these out into different nodes, replace the
# [group:children] section with [group], and list individual nodes.
slurm-cache:
  children:
    slurm-controller: {}

slurm-nfs-client:
  children:
    slurm-node: {}

slurm-metric:
  children:
    slurm-controller: {}

slurm-login:
  children:
    slurm-controller: {}

# Group for all slurm cluster members
slurm-cluster:
  children:
    slurm-controller: {}
    slurm-node: {}
    slurm-cache: {}
    slurm-nfs: {}
    slurm-metric: {}
    slurm-login: {}
